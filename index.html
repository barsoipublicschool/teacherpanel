<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barsoi Public School - Teacher Portal</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --accent-hover: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        /* --- ATTRACTIVE DARK LOGIN CONTAINER --- */
        .login-container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 2.5rem 2rem;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .school-header {
            margin-bottom: 2rem;
        }

        .school-title {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            margin-bottom: 0.3rem;
        }

        .login-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .input-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            font-size: 1rem;
            color: var(--text-main);
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
        }

        .btn-login {
            width: 100%;
            padding: 0.85rem;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            margin-top: 0.5rem;
        }

        .btn-login:hover {
            background: var(--accent-hover);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
            transform: translateY(-2px);
        }

        .error-msg {
            color: #ef4444;
            margin-top: 1rem;
            font-size: 0.85rem;
            display: none;
        }

        /* --- DASHBOARD STYLES --- */
        .dashboard-container {
            width: 100%;
            max-width: 900px;
            padding: 1rem;
            display: none; /* Controlled by JavaScript */
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            padding: 1.2rem 1.8rem;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .header h1 {
            font-size: 1.4rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ef4444;
            padding: 0.5rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: #ef4444;
            color: white;
        }

        /* 2-by-2 Card View Layout */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }

        .card {
            background: var(--card-dark);
            padding: 1.8rem;
            border-radius: 14px;
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: var(--accent-gradient);
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border-color: rgba(99, 102, 241, 0.4);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-icon {
            font-size: 2rem;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 10px;
            color: #818cf8;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Mobile View Response */
        @media (max-width: 600px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- 1. DARK THEME LOGIN SCREEN -->
    <div class="login-container" id="loginScreen">
        <div class="school-header">
            <h1 class="school-title">BARSOI PUBLIC SCHOOL</h1>
            <div class="login-subtitle">
                <i class="fa-solid fa-user-tie"></i> Teacher Log In
            </div>
        </div>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="username">User ID</label>
                <input type="text" id="username" placeholder="Enter Teacher ID" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter Password" required>
            </div>
            <button type="submit" class="btn-login">Log In</button>
            <p class="error-msg" id="errorMsg">Invalid User ID or Password!</p>
        </form>
    </div>

    <!-- 2. DASHBOARD SCREEN -->
    <div class="dashboard-container" id="dashboardScreen">
        <div class="header">
            <h1>BARSOI PUBLIC SCHOOL - Teacher Panel</h1>
            <button class="btn-logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>

        <!-- 2-by-2 Grid Layout -->
        <div class="cards-grid">
            
            <div class="card" onclick="navigateTo('Attendance')">
                <div class="card-icon"><i class="fa-solid fa-calendar-check"></i></div>
                <div class="card-title">Mark Attendance</div>
            </div>

            <div class="card" onclick="navigateTo('CW/HW')">
                <div class="card-icon"><i class="fa-solid fa-pen-to-square"></i></div>
                <div class="card-title">Update CW/HW</div>
            </div>

            <div class="card" onclick="navigateTo('Study Materials')">
                <div class="card-icon"><i class="fa-solid fa-book-open"></i></div>
                <div class="card-title">Update Study Materials</div>
            </div>

            <div class="card" onclick="navigateTo('Marks Entry')">
                <div class="card-icon"><i class="fa-solid fa-file-signature"></i></div>
                <div class="card-title">Marks Entry</div>
            </div>

            <div class="card" onclick="navigateTo('Teacher Profile')">
                <div class="card-icon"><i class="fa-solid fa-id-badge"></i></div>
                <div class="card-title">Teacher Profile</div>
            </div>

            <div class="card" onclick="navigateTo('Student Profile')">
                <div class="card-icon"><i class="fa-solid fa-users"></i></div>
                <div class="card-title">Student Profile</div>
            </div>

        </div>
    </div>

    <script>
        // Credentials Configuration
        const CORRECT_USER = "teacher";
        const CORRECT_PASS = "1234";

        const loginScreen = document.getElementById('loginScreen');
        const dashboardScreen = document.getElementById('dashboardScreen');
        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const logoutBtn = document.getElementById('logoutBtn');

        // Check if persistent login session exists
        window.onload = function() {
            if (localStorage.getItem('isTeacherLoggedIn') === 'true') {
                showDashboard();
            }
        };

        // Handle Login Submission
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();

            if (usernameInput === CORRECT_USER && passwordInput === CORRECT_PASS) {
                localStorage.setItem('isTeacherLoggedIn', 'true');
                showDashboard();
            } else {
                errorMsg.style.display = 'block';
            }
        });

        // Handle Logout
        logoutBtn.addEventListener('click', function() {
            localStorage.removeItem('isTeacherLoggedIn');
            showLogin();
        });

        function showDashboard() {
            loginScreen.style.display = 'none';
            dashboardScreen.style.display = 'block';
            errorMsg.style.display = 'none';
        }

        function showLogin() {
            dashboardScreen.style.display = 'none';
            loginScreen.style.display = 'block';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        // Direct URL Routing Handler
        function navigateTo(moduleName) {
            let targetUrl = "";

            switch(moduleName) {
                case 'Attendance':
                    targetUrl = "http://www.barsoipublicschool.github.io/attendance";
                    break;
                case 'CW/HW':
                    targetUrl = "http://barsoipublicschool.github.io/homework";
                    break;
                case 'Study Materials':
                    targetUrl = "http://www.bps.in/studymaterial";
                    break;
                case 'Marks Entry':
                    targetUrl = "http://www.bps.in/marksentry";
                    break;
                case 'Teacher Profile':
                    targetUrl = "http://www.bps.in/teacherprofile";
                    break;
                case 'Student Profile':
                    targetUrl = "http://www.bps.in/studentprofile";
                    break;
                default:
                    alert("URL nahi mila!");
                    return;
            }

            // External link opens in a new tab
            window.open(targetUrl, "_blank");
        }
    </script>
</body>
</html>
